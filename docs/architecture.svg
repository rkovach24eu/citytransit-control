" font-family="Arial" font-size="18" font-weight="bold" fill="#173654">C4 AI: прогноз ETA</text><text x="732" y="265" font-family="Arial" font-size="15" fill="#52677e">regression; ETA / q90 / version</text><rect x="20" y="380" width="280" height="100" rx="10" fill="white" stroke="#16758b"/><text x="32" y="415" font-family="Arial" font-size="18" font-weight="bold" fill="#173654">D1 Операційні дані</text><text x="32" y="445" font-family="Arial" font-size="15" fill="#52677e">маршрути / телеметрія</text><rect x="370" y="380" width="280" height="100" rx="10" fill="white" stroke="#16758b"/><text x="382" y="415" font-family="Arial" font-size="18" font-weight="bold" fill="#173654">C7 Аудит і контроль</text><text x="382" y="445" font-family="Arial" font-size="15" fill="#52677e">метрики → DP-08 / DP-09</text><rect x="720" y="380" width="280" height="100" rx="10" fill="white" stroke="#16758b"/><text x="732" y="415" font-family="Arial" font-size="18" font-weight="bold" fill="#173654">D2 / D3</text><text x="732" y="445" font-family="Arial" font-size="15" fill="#52677e">моделі / журнал рішень</text><text x="25" y="535" font-family="Arial" font-size="17" fill="#173654">Рішення про зміну руху завжди підтверджує людина.</text><text x="25" y="565" font-family="Arial" font-size="15" fill="#52677e">Прототип: ETA / локальний UI / CSV, JSON, JSONL. Решта інтеграцій є проєктними.</text></svg>